# ANYbotics' elevation_mapping, configured for the simulated ANYmal.
#
# This is the layer gbplanner's ground-robot mode projects onto: with
# RobotParams.type kGroundRobot, Rrg::projectSampleEleMap reads it at the
# robot's centre and at the four corners of its footprint, snaps the sample's
# height to the terrain, and refuses the sample if a corner is steeper than
# PlanningParams.max_inclination or has never been observed. With no layer it
# refuses everything, which is why gbplanner's own UGV demos plan ground robots
# as aerial ones.
#
# Values follow the package's own config/robots and config/elevation_maps
# examples; what is specific here is the frames, the two inputs and the size.
/**:
  ros__parameters:
    # Both of the robot's lidars. The VLP-16's +/- 15 degree fan never reaches
    # the ground closer than 3.8 m, and an edge is refused if any point along it
    # is not on observed ground, so the near field has to come from somewhere:
    # the downward ground_scan is the simulated stand-in for the depth cameras
    # that do this job on the real ANYmal.
    inputs: ['lidar', 'ground_scan']
    lidar:
      type: pointcloud
      topic: /anymal/lidar/points
      queue_size: 10
      publish_on_update: true
      sensor_processor:
        type: laser
        min_radius: 0.018
        beam_angle: 0.0006
        beam_constant: 0.0015
    ground_scan:
      type: pointcloud
      topic: /anymal/ground_scan/points
      queue_size: 10
      publish_on_update: true
      sensor_processor:
        type: laser
        min_radius: 0.018
        beam_angle: 0.0006
        beam_constant: 0.0015

    # gz prefixes every link with the model name. map_frame_id has to match
    # PlanningParams.global_frame_id in gbplanner_config.yaml.
    map_frame_id: "world"
    robot_base_frame_id: "anymal/base_link"
    track_point_frame_id: "anymal/base_link"
    track_point_x: 0.0
    track_point_y: 0.0
    track_point_z: 0.0

    # nav_msgs/Odometry, which is what this fork's robotPoseSubscriber_ takes
    # and what gz's OdometryPublisher gives us. Leaving it empty would set
    # ignoreRobotMotionUpdates_ and drop the covariance growth between updates.
    robot_pose_with_covariance_topic: "/anymal/odometry"

    # The map is robot-centric and moves with the robot, so this has to cover
    # BoundedSpaceParams/Local, which the ANYmal config sets to +/- 20 m: a
    # sample outside the map is refused by isInside() before its height is read.
    length_in_x: 44.0
    length_in_y: 44.0
    resolution: 0.2

    # Seed a flat patch under the robot at startup, and this is not a
    # convenience: no sensor sees underneath a robot, so the cell the robot
    # occupies is NaN, and with kGroundRobot that means projectSampleEleMap
    # refuses the robot's own position and the graph never leaves the root.
    # Measured before this was on: 3905 planning calls, one vertex each, with
    # the diagnostic naming probe 0 at the robot's own coordinates as never
    # observed. A robot standing up is evidence of ground at its feet, which is
    # exactly what the package's PlanarFloorInitializer encodes.
    initialize_elevation_map: true
    initialization_method: 0            # PlanarFloorInitializer
    target_frame_init_submap: "anymal/base_link"
    # base_link is 0.6 m above the ground, and the initializer takes that
    # frame's z plus this offset as the plane's height.
    init_submap_height_offset: -0.6
    length_in_x_init_submap: 2.0
    length_in_y_init_submap: 2.0
    margin_init_submap: 0.3

    min_update_rate: 1.0
    time_tolerance: 0.5
    fused_map_publishing_rate: 4.0

    min_variance: 0.0001
    max_variance: 0.05
    mahalanobis_distance_threshold: 2.5
    multi_height_noise: 0.01
    enable_skip_lower_points: true
    scanning_duration: 0.01

    # Visibility cleanup is what removes a cell the sensor has since seen
    # through - the map's answer to a wrong measurement, and a large part of
    # why this package is here rather than a hand-rolled height grid.
    remove_penetrated_points_rate: 5.0
    visibility_cleanup_rate: 5.0
    enable_continuous_cleanup: false

    robot_motion_map_update/covariance_scale_translation_x: 0.0
    robot_motion_map_update/covariance_scale_translation_y: 0.0
    robot_motion_map_update/covariance_scale_translation_z: 0.0
    robot_motion_map_update/covariance_scale_rotation_x: 0.0
    robot_motion_map_update/covariance_scale_rotation_y: 0.0
    robot_motion_map_update/covariance_scale_rotation_z: 0.0
