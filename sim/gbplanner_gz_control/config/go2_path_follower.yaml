# Path tracker for the simulated Unitree Go2.
#
# The robot walks: CHAMP turns this Twist into a gait, so there is no
# minimum turning radius and no wheel scrub. That removes the reason the
# wheeled configs had to trade lookahead against yaw rate.
/**:
  ros__parameters:
    # 20 Hz, as the UAV follower and the ROS 1 pure-pursuit tracker both ran.
    control_rate: 20.0

    # Waypoint acceptance, in the ground plane. Wider than the UAV's 0.4 m: a
    # differential drive that overshoots a waypoint has to turn around to get
    # back inside a tight radius, and the planner's next leg starts from
    # wherever the robot is anyway.
    trans_tolerance: 0.5

    # How close the final heading has to be before the robot stops turning.
    rot_tolerance: 0.2

    # v = min(kp_lin * distance, v_max) * cos(heading error). v_max / kp_lin is
    # where the command saturates: 1 m out at these values.
    kp_lin: 1.0
    kp_yaw: 1.5

    # PlanningParams.v_max and yaw_rate_max in the anymal config are 0.5 and
    # 0.3; matched exactly here, or the robot outruns the map the planner
    # planned against. DiffDrive's limits in the SDF sit just above these so
    # it is these that bind.
    v_max: 0.5
    yaw_rate_max: 0.8

    # Heading error above which forward speed is given up entirely and the robot
    # turns on the spot. 0.7 rad is about 40 degrees; beyond that cos() has
    # already taken most of the speed away and what is left only widens the arc.
    heading_align_threshold: 0.7

    # Turn to the last waypoint's own heading once its position is reached. The
    # planner yaws its paths deliberately -- the next leg is planned from this
    # heading -- so it is worth the extra turn.
    goal_yaw_enable: true

    # Older than this and odometry counts as gone: stop, rather than keep
    # driving on a command computed against a stale pose.
    odometry_timeout: 1.0

    # --- Stuck detection and recovery ---
    #
    # A differential drive wedged against a step reports the same odometry for
    # as long as you let it while this node goes on asking for half a metre per
    # second. Measured on niosh_osrf: 0.54 m/s commanded for 400 s with the pose
    # moving by micrometres, the planner still producing paths, the control
    # interface still waiting for a path end that could not arrive, and nothing
    # anywhere logging an error. The run was over and looked healthy.
    #
    # So: if the robot is being asked to drive and has not covered
    # stuck_progress in stuck_timeout, back out and try again. Turning on the
    # spot is not being stuck and does not count.
    stuck_timeout: 6.0
    stuck_progress: 0.15

    # Reverse, with a little yaw so a second attempt does not retrace the first
    # one straight back into whatever stopped the robot. The sign of the yaw
    # alternates between attempts.
    recovery_duration: 2.0
    recovery_speed: 0.4
    recovery_yaw_rate: 0.4

    # After this many attempts on one path, give up on it: drop the path and
    # hold. The planner will keep planning, but the control interface only asks
    # for a new path once it believes the current one is finished, so a robot
    # that is properly trapped still ends the run - it just ends it visibly,
    # with a warning, instead of pretending to drive.
    recovery_attempts_max: 3

    # How far the robot may drift from its starting height before this node
    # decides it is no longer in the world and stops driving it. These gz
    # worlds are a single mesh with nothing outside it, so a robot that leaves
    # the tunnel falls and keeps falling - measured on a live run, z = -850 km,
    # still accelerating, with nothing in the stack noticing.
    world_z_limit: 50.0

    # Steer at the first path point this far ahead, rather than at the nearest
    # unreached waypoint. Just outside trans_tolerance the bearing to a waypoint
    # swings wildly with the robot's own position, so the heading error flips
    # sign as the robot rotates: it turns one way, crosses the bearing, turns
    # back, and never gets under heading_align_threshold to earn any forward
    # speed. Measured on a live session: the robot turned on the spot for over
    # fifteen seconds without ever converging. A point a little over a metre out
    # has a stable bearing, which is why pure pursuit uses one.
    # 0.8, not the 1.2 the Husky uses, and the number comes from the control
    # interface rather than from the tracker. pci_general walks its own index
    # along the path one waypoint at a time and only advances when the robot is
    # within path_progression_dist_thr of each - 1.0 m, tightening to 0.8 on a
    # turn, in c3lab's config. A lookahead longer than that cuts the corner
    # wide enough that some waypoint is never approached closely, the index
    # stops advancing, and the interface waits out the rest of the run for a
    # path end it will never see.
    lookahead_distance: 0.6
