# Generated from /home/santal/git/gbplanner_ros/gbplanner/config/ugv/gzc/niosh_exploration/gbplanner_config.yaml by tools/rosparam2ros2.py.
# rad()/deg() expressions are expanded; the originals are kept in comments.
#
# The source folder is ugv/gzc/, because upstream only ever shipped a Gazebo
# Classic variant of the UGV scenarios; there was no ugv/gz/ to convert. Nothing
# in these values is Classic-specific, so the folder is renamed rather than the
# contents changed.
#
# RobotParams.type stays kAerialRobot, which is what upstream ships for both UGV
# scenarios and looks like a mistake until you read rrg.cpp: kGroundRobot routes
# every sample and every edge through projectSampleEleMap /
# getProjectedEdgeStatusEleMap, an elevation map this stack does not build. The
# UGV is constrained instead by pinning the Z sampler to a constant and flattening
# the local bounding space, which is what the blocks below do. Changing the type
# is not a one-line edit.
/**:
  ros__parameters:
      # Configurations for the exploration pipeline.
      # For more details, please check comments in the params.h file and the wiki.
      #-------------------------------------------------------------------------------
      # ROBOT CONFIGURATION
      #-------------------------------------------------------------------------------
    RobotParams:
      type:               kAerialRobot # kGroundRobot
      # size:               [0.4, 0.0, 0.0] # Actual size of the robot in meters [x, y, z]
      size:               [1.0, 1.0, 0.4] # Actual size of the robot in meters [x, y, z]
      size_extension_min: [0.0, 0.0, 0.0] # minimum extension outside of robot size allowed to operate
      size_extension:     [0.2, 0.2, 0.0] # maximum extension outside of the robot size
      # Lifts the planner's collision box 0.32 m above the robot's base frame,
      # and nothing else - the sensor frustums have their own center_offset.
      # base_link sits 0.13 m up and RobotParams.size is 0.4 m tall, so the box
      # occupies z in [0.25, 0.65] above the ground: the Husky's real body,
      # give or take the 0.13 m of ground clearance under its belly.
      #
      # Upstream ships 0.0, written for the SMB whose base frame is 0.5 m up.
      # On the Husky that puts the box through the floor, and the value cannot
      # simply be raised by the 0.37 m difference between the two frames: at
      # 0.37 the band the box covers reads kOccupied rather than kUnknown, and
      # that distinction is fatal. Rrg::buildGraph clears its own root box with
      # augmentFreeBox, which calls clearIfUnknown and by construction never
      # touches an observed-occupied voxel, so the root box stays occupied,
      # every edge out of the root vertex is refused, and the graph never
      # leaves one vertex.
      #
      # What made that band occupied was the robot seeing itself. The lidar is
      # 0.436 m above base_link at x = 0.424 with a +/- 45 degree vertical fan,
      # so its downward-rear rays strike the Husky's own deck at ranges from
      # 0.3 m out to 0.98 m - inside min_ray_length_m, which upstream leaves at
      # 0.5 - and voxblox integrates them as a solid shell at deck height.
      # Raising min_ray_length_m to 1.0 in voxblox_sim_config.yaml drops every
      # one of those returns (the furthest self-hit is 0.98 m) and costs only
      # the ring of floor between 0.81 m, where the 45 degree ray first reaches
      # the ground, and 1.0 m. With that done the box sits at the robot's real
      # height and the graph builds immediately: measured over two 420 s runs
      # on niosh_osrf, the first planning call already produced 243 and 271
      # vertices, where the same scenario needed ~1400 root-only calls before.
      #
      # An earlier version of this file used 0.80 instead, which clears the
      # self-hit shell by flying over it. It works, and it was how the shell
      # was found, but it models the robot as a box floating 0.6-1.0 m up: the
      # planner cannot see anything the wheels would hit. 0.32 with the ray
      # length fixed is the same result without that blind spot.
      center_offset:      [-0.0, 0.0, 0.32]
      relax_ratio:        0.5 # Used to define an intermediate size between size_extension_min and size_extension for planning
      bound_mode:         kExtendedBound
      safety_extension:   [0.5, 2.0, 2.0] # Safety extension outside the bounding box of a path segment used to improve it by pushing it away from obstacles
#-------------------------------------------------------------------------------
# SENSOR CONFIGURATION
#  sensor_list: Define a set of sensors relevant to the exploration task.
#  rotations: ZYX order;
#             all follows ROS convention (X-forward, Y-left, Z-Up).
#-------------------------------------------------------------------------------
    SensorParams:
      sensor_list:      ["OS064", "Cam", "CamExp"]
      OS064:
        type:           kLidar
        max_range:      20.0
        center_offset:  [0.0, 0.0, 0.0]
        rotations:      [0.0, 0.0, 0.0]
        fov:            [6.283185307179586, 1.5707963267948966]  # was [rad(2*pi), rad(90*pi/180)]
        resolution:     [0.17453292519943295, 0.17453292519943295]  # was [rad(10.0*pi/180), rad(10.0*pi/180)]
        frontier_percentage_threshold: 0.005
      CamF:
        type:           kLidar
        max_range:      3.5
        center_offset:  [0.0, 0.0, 0.0]
        rotations:      [0.0, 0.0, 0.0]
        fov:            [1.7453292519943295, 1.0471975511965976]  # was [rad(100*pi/180), rad(60*pi/180)]
        resolution:     [0.06981317007977318, 0.06981317007977318]  # was [rad(4.0*pi/180), rad(4.0*pi/180)]
        frontier_percentage_threshold: 0.01
      Cam:
        type:           kLidar
        CameraType:     kRotating
        rot_lims:       [-1.3962634015954636, 1.3962634015954636]  # was [rad(-80*pi/180.0), rad(80*pi/180.0)]
        max_range:      2.0 #2.5
        min_range:      0.25
        center_offset:  [0.0, 0.0, 0.0]
        rotations:      [0.0, 0.0, 0.0]
        fov:            [1.3962634015954636, 1.0471975511965976]  # was [rad(80*pi/180.0), rad(60*pi/180.0)]
        # resolution:     [rad(5.0*pi/180), rad(5.0*pi/180)]
        # resolution:     [rad(2.0*pi/180), rad(2.0*pi/180)]
        resolution:     [0.08726646259971647, 0.08726646259971647]  # was [rad(5.0*pi/180), rad(5.0*pi/180)]
        frontier_percentage_threshold: 0.06
      CamExp:
        type:           kLidar
        CameraType:     kRotating
        rot_lims:       [-1.57, 1.57]
        max_range:      5.0
        min_range:      0.25
        center_offset:  [0.0, 0.0, 0.0]
        rotations:      [0.0, 0.0, 0.0]
        fov:            [1.4660765716752369, 1.117010721276371]  # was [rad(84*pi/180.0), rad(64*pi/180.0)]
        # resolution:     [rad(5.0*pi/180), rad(5.0*pi/180)]
        # resolution:     [rad(2.0*pi/180), rad(2.0*pi/180)]
        resolution:     [0.12217304763960307, 0.12217304763960307]  # was [rad(7.0*pi/180), rad(7.0*pi/180)]
        frontier_percentage_threshold: 0.06
    
    CameraAnnotationParams:
      sensor_list:      ["Cam"]
      Cam:
        type:           kLidar
        # rot_lims:       [-1.57, 1.57]
        rot_lims:       [-1.55, 1.55]
        max_range:      2.0 #2.5
        center_offset:  [0.0, 0.0, 0.0]
        rotations:      [0.0, 0.0, 0.0]
        fov:            [1.4660765716752369, 1.117010721276371]  # was [rad(84*pi/180.0), rad(64*pi/180.0)]
        resolution:     [0.03490658503988659, 0.03490658503988659]  # was [rad(2.0*pi/180), rad(2.0*pi/180)]
        frontier_percentage_threshold: 0.01
#-------------------------------------------------------------------------------
# SAMPLING SPACE CONFIGURATION
#   Global: Strictly defined bounds for the whole environment.
#   Local: Define a local space wrt current robot state for planning.
#-------------------------------------------------------------------------------
    BoundedSpaceParams:
      Global:
        type:           kCuboid
        # min_val:        [-6.0, -12.0, -0.5]
        # max_val:        [6.0, 2.0, 11.5]
        min_val:        [-100.0, -1000.0, -10.5]
        max_val:        [1000.0, 1000.0, 30.0]
        # min_val:        [-2.0, -30.0, -1.0]
        # max_val:        [30.0, 30.0, 15.0]
        # min_val:        [10.0, -25.0, 1.0]
        # max_val:        [70.0, 35.0, 8.0]
      Local:
        type:           kCuboid
        # min_val:        [-7.5, -7.5, -7.0]
        # max_val:        [7.5, 7.5, 7.0]
        min_val:        [-15.0, -15.0, -1.0]
        max_val:        [15.0, 15.0, 1.0]
        # min_val:        [-20.0, -20.0, -4.0]
        # max_val:        [20.0, 20.0, 4.0]
        # min_val:        [-10.0, -10.0, -4.0]
        # max_val:        [10.0, 10.0, 4.0]
        min_extension:  [-20.0, -20.0, -20.0]
        max_extension:  [20.0, 20.0, 20.0]
      LocalSearch:
        type:           kCuboid
        min_val:        [-50.0, -50.0, -1.0]
        max_val:        [50.0, 50.0, 1.0]
      # Adaptive OBB:
      LocalAdaptiveExp:
        type:           kCuboid
        min_val:        [-10.0, -10.0, -0.75]
        max_val:        [10.0, 10.0, 0.75]
    NoGainZones:
      g1:  # Back
        type:           kCuboid
        min_val:        [-50.0, -10.0, -10.0]
        max_val:        [2.0, 10.0, 10.0]
#-------------------------------------------------------------------------------
# SAMPLING POLICY CONFIGURATION
#   Sample space limited to 4 states: X, Y, Z, and Heading
#-------------------------------------------------------------------------------
    RandomSamplerParams:
      SamplerForExploration:
        X:
          pdf_type:       kUniform
          sample_mode:    kLocal
        Y:
          pdf_type:       kUniform
          sample_mode:    kLocal
        Z:
          pdf_type:       kConst
          sample_mode:    kManual
          const_val:      0.0
        Heading:
          pdf_type:       kUniform
          sample_mode:    kManual
          min_val:        -3.141592653589793  # was rad(-pi)
          max_val:        3.141592653589793  # was rad(pi)
        Pitch:
          # pdf_type:       kUniform
          # sample_mode:    kManual
          # min_val:        rad(-pi/2)
          # max_val:        rad(pi/2)
          pdf_type:       kConst
          sample_mode:    kManual
          const_val:      0.0
      SamplerForSearching:
        X:
          pdf_type:       kUniform
          sample_mode:    kLocal
        Y:
          pdf_type:       kUniform
          sample_mode:    kLocal
        Z:
          pdf_type:       kConst
          sample_mode:    kManual
          const_val:      0.0
        Heading:
          pdf_type:       kUniform
          sample_mode:    kManual
          min_val:        -3.141592653589793  # was rad(-pi)
          max_val:        3.141592653589793  # was rad(pi)
        Pitch:
          # pdf_type:       kUniform
          # sample_mode:    kManual
          # min_val:        rad(-pi/2)
          # max_val:        rad(pi/2)
          pdf_type:       kConst
          sample_mode:    kManual
          const_val:      0.0
      SamplerForAdaptiveExp:
        X:
          pdf_type:       kUniform
          sample_mode:    kLocal
        Y:
          pdf_type:       kUniform
          sample_mode:    kLocal
        Z:
          pdf_type:       kConst
          sample_mode:    kManual
          const_val:      0.0
        Heading:
          pdf_type:       kUniform
          sample_mode:    kManual
          min_val:        -3.141592653589793  # was rad(-pi)
          max_val:        3.141592653589793  # was rad(pi)
        Pitch:
          # pdf_type:       kUniform
          # sample_mode:    kManual
          # min_val:        rad(-pi/2)
          # max_val:        rad(pi/2)
          pdf_type:       kConst
          sample_mode:    kManual
          const_val:      0.0
    
#-------------------------------------------------------------------------------
# EXPLORATION CONFIGURATION
# exp_sensor_list: sensors used to compute exploration gain.
#-------------------------------------------------------------------------------
    PlanningParams:
      type:             kBasicExploration #kAdaptiveExploration, kBasicExploration
      rr_mode:          kGraph
      graph_building_mode: kBasic
      exp_sensor_list:  ["OS064"]
      # exp_sensor_list:  ["CamExp"]
      # exp_sensor_list:  ["CamF"]
      inspection_sensor_list:  ["Cam"]
      # no_gain_zones_list: ["g1"]
      v_max:            1.0 # max velocity m/s
      v_homing_max:     0.9 # max velocity m/s
      yaw_rate_max:     0.9 # max angular velocity rad/s
      yaw_tangent_correction: false # If true - all headings will be along the path segment
      edge_length_min:  0.2
      edge_length_max:  3.0
      edge_overshoot:   0.0 # m - Account for possible tracking error by collision checking on an extended edge
      num_vertices_max: 400.0 # 400 # graph building stops if these many vertices are added 
      num_edges_max:    7000.0 # graph building stops if these many edges are added
      num_loops_cutoff: 2000.0 # Maximum iterations in which no vertices or edges are added to the graph
      num_loops_max:    7000.0 # Maximum iterations possible for graph building
      nearest_range:    3.0 # The max range within which a new vertex can be connected to an existing vertex
      nearest_range_min: 0.2 # >= edge_length_min
      nearest_range_max: 3.0 # <= edge_length_max
      use_current_state: true # If true, it will use the current state to plan from instead of the state provided by the PCI in the service call
      use_ray_model_for_volumetric_gain: true # if false, will check voxel by voxel in the sensor frustum 
      exp_gain_voxel_size: 0.8 # used if use_ray_model_for_volumetric_gain is false
      # Gains:
      path_length_penalty: 0.01 # 0.4
      path_direction_penalty: 0.2 # 0.01
      # true, where upstream's ugv/gzc/niosh_exploration says false. This is
      # the one place this config leaves upstream on something that is not a
      # robot dimension, and the reason is measured rather than argued.
      #
      # With false, Rrg::getBestPathSimplified refuses any best path whose
      # direction differs from the running average by more than 120 degrees,
      # and returns an EMPTY path instead - three times in a row, then it lets
      # the fourth through and resets the counter. In a mine corridor the robot
      # has to turn around, so the refusal fires constantly: measured live, 37
      # direction changes and 38 empty paths over 122 planning calls. Each
      # refusal costs a full planning cycle in which the control interface gets
      # nothing, so the robot sits still, and every fourth one is accepted, so
      # it lurches back the way it came. That is the "it stops, and stopping
      # and restarting the planner fixes it" behaviour: the restart resets
      # dir_change_count_.
      #
      # Upstream itself ships true for ugv/gzc/urban_exploration and
      # uav/gzc/niosh_exploration, and true is also the default when the
      # parameter is absent, which is what uav/gz/cave_exploration runs on.
      allow_sudden_dir_change: true
      occupied_voxel_gain: 0.0
      free_voxel_gain:  0.0 # prefer directions towards more free voxels in case of the dead-end
      unknown_voxel_gain: 60.0
      global_graph_odom_dist: 1.0
      select_closest_frontier: false
    
      traverse_length_max: 5.0 # Maximum length of the best path will be truncated to for actual traversal
      traverse_time_max: 5000.0
      path_safety_enhance_enable: true
      augment_free_voxels_time: 3.0
      free_frustum_before_planning: false
      freespace_cloud_enable: false
      leafs_only_for_volumetric_gain: false # Whether to calculate gain of the entire path or only the leaf nodes
      cluster_vertices_for_gain: false
      clustering_radius: 0.5
      path_interpolation_distance: -1.0 # 0.5
    
      max_ground_height: 0.5 # All points will be projected to this height from ground
      robot_height: 0.5  # Height of robot's base frame from ground
      max_inclination: 0.3490658503988659  # was rad(20.0*pi/180)
      
      time_budget_limit: 5000.0 # seconds
      auto_homing_enable: false
      go_home_if_fully_explored: false
    
      nonuniform_ray_cast: false
      ray_cast_step_size_multiplier: 1.0
    
      use_camera_gain: false
      annotate_map_with_camera: true
      
      inspection_planning: false
    
      keep_leaf_yaw_only: true
    
      enable_opening_traversal: false
      opening_alignment_z_offset: 0.0 # -0.25
      only_opening_traversal: false
    
      auto_opening_path_approval: true
      max_opening_height: 20.0
    
      box_check_method: 0
      line_check_method: 1
    
      add_only_frontiers_to_global_graph: true
    
      min_coverage_percentage: 0.9
      inspection_xy_spacing: 1.0 # 1.5
      inspection_z_spacing: 0.5 # 2.0
      inspection_thr_esdf_dist: 0.75 # 1.5
      inspection_target_viewing_range: 1.5 #1.5 # 2.5
      inspection_graph_vertices: 500
      max_inspection_vertices: 100
      #: 10
    
      max_surface_distance: 1.5
      limit_vertices_to_surface: false
      min_occ_surface: 0.0
    
      local_navigation_reaching_radius: 2.0
    
      max_exploration_iterations: 5
      exploration_only: false
      # compartment_centers: [2.0, 0.25, 2.0, 6.0, 0.25, 2.0, 10.0, 0.25, 2.0, 14.0, 0.25, 2.0]
      # compartment_dimensions:
