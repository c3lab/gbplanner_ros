# Control interface for the Unitree Go2.
#
# c3lab/gbplanner_ros@anymal's planner_control_interface_sim_config.yaml, which
# is a real deployment's, with one deliberate change: init_motion_enable.
/**:
  ros__parameters:
    run_mode: kReal
    trigger_mode: kManual
    # kGround, not the kAerial the UGV configs here carry. It is what c3lab run
    # on the real machine.
    robot_type: kGround
    output_type: kTopic

    # true, where c3lab have false, and this is the only value in the file that
    # is not theirs.
    #
    # The initialisation step exists because nothing sees the ground underneath
    # a robot. Driving forward fixes that by itself: the patch the robot ends up
    # standing on was observed a moment earlier, from behind, on the way in. On
    # a real ANYmal the robot has walked into the area and the elevation map is
    # already populated by the time anyone triggers the planner, so upstream can
    # leave this off. A simulation starts cold, with the robot dropped into an
    # unmapped world, which is exactly the case the step was written for - and
    # it is what the "Initialization" button in the RViz panel triggers.
    init_motion_enable: true
    init_motion:
      # Ground robot: the takeoff and drop are aerial-only and stay at zero.
      # Three metres forward is c3lab's number, and comfortably more than the
      # range at which the lidar starts seeing floor, so the robot
      # ends the manoeuvre standing on ground it has already measured.
      z_takeoff: 0.0
      z_drop: 0.0
      x_forward: 3.0

    planner_trigger_lead_time: 3.0
    smooth_heading_enable: true

    # All of these are c3lab's, and all of them are far tighter than the UGV
    # configs in this repository (1.75 / 2.0 / 1.75 / 3.4). A robot moving at
    # 0.5 m/s along paths the planner spaced for it does not need the metre and
    # a half of slack a 2 m/s vehicle does, and the loose yaw threshold in
    # particular would let the control interface call a waypoint reached while
    # the robot faced anywhere at all.
    path_end_dist_thr: 0.7
    path_end_yaw_thr: 0.5
    path_progression_dist_thr: 1.0
    path_progression_dist_thr_min: 0.8
    # 3.4 rather than c3lab's 0.7, and this one is about the tracker, not the
    # robot. pci_general only advances its waypoint index when the robot is
    # both near a waypoint and within this of that waypoint's heading. c3lab
    # run a tracker that follows the commanded heading along the path; the
    # tracker here follows positions and only aligns to a heading at the end of
    # a path, so at 0.7 the index stops advancing part-way, the interface waits
    # out the run for a path end it never sees, and the planner is called
    # exactly once - measured, three runs in a row. The UGV configs in this
    # repository carry 3.4 for the same reason.
    #
    # The cost is real: with the check this loose the interface will call a
    # waypoint reached with the robot facing well away from the path. Tightening
    # it belongs with a tracker that tracks heading per waypoint.
    path_progression_yaw_thr: 3.4
    path_progression_yaw_thr_min: 3.4
    path_progression_pitch_thr: 3.14

    interpolate_traj: true
    use_time_from_start: true
    travel_backward: false

    # Group related parameters to be shared between nodes.
    RobotDynamics:
      v_max: 0.25
      v_init_max: 0.2
      v_homing_max: 0.2
      yaw_rate_max: 0.4
      dt: 6.0
      a_max: 4.0
