---
# Pinned Gazebo Garden collection.
#
# This replaces the upstream collection file that bootstrap.sh used to fetch at
# run time (ntnu-arl/gz-sim, branch fix/position_control,
# collection-garden.yaml). That file pins every repository to a *branch*, so a
# bootstrap run picks up whatever the branch heads happen to be that day. Garden
# is EOL and its branches still move: gz-common5 dropped the pre-5.2 assimp
# compatibility path, so AssimpLoader.cc now includes <assimp/GltfMaterial.h>
# unconditionally. Ubuntu 20.04 (Focal) - the base of the noetic image - ships
# assimp 5.0.1, which has no such header, and the build dies with:
#
#   gz-common/graphics/src/AssimpLoader.cc:38:10: fatal error:
#   assimp/GltfMaterial.h: No such file or directory
#
# The commits below are the ones the known-good workspace was built from, so a
# fresh bootstrap reproduces it instead of tracking upstream drift.
#
# To bump the collection: check out the new commits, verify `make bootstrap`
# builds, then regenerate this file from the workspace with
#   cd bootstrap/gazebo_garden_ws/src && vcs export --exact
# and re-add these comments.
repositories:
  gz-cmake:  # gz-cmake3
    type: git
    url: https://github.com/gazebosim/gz-cmake
    version: 435c514c917bc97ca34af88ec1c9ce50369a66d5
  gz-common:  # gz-common5, last commit that still guards assimp < 5.2
    type: git
    url: https://github.com/gazebosim/gz-common
    version: 2cab1e5cc0cfacaf9bbcd4a7af544d3715237dbe
  gz-fuel-tools:  # gz-fuel-tools8
